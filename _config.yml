theme: minima
title: DorpNay's GitHub Pages
description: Personal site and project notes published with GitHub Pages
author: DorpNay
url: "https://DorpNay.github.io"
baseurl: "/skills-github-pages"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-github-metadata

# Preserve upstream reference copies in Git, but do not render/publish them as Pages content.
exclude:
  - docs/upstream-archive
