[project]
name = "alandi-ai-mobile-agent"
version = "10.0.0"
description = "Local-first AI Mobile Agent and private Ollama gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "cryptography==50.0.2",
  "jsonschema==4.26.0",
  "pypdf==7.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "PyYAML==6.0.3",
  "vulture==2.16",
]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { pypdf = "2026-11-14T00:00:00Z", fastapi = "2026-11-21T23:59:59Z" }

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.vulture]
paths = ["gateway", "observability"]
exclude = ["**/tests/**"]
min_confidence = 90
