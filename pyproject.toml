[project]
name = "alandi-ai-mobile-agent"
version = "10.0.0"
description = "Local-first AI Mobile Agent and private Ollama gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "cryptography==50.0.2",
  "jsonschema==4.26.0",
  "pypdf==6.21.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "PyYAML==6.0.3",
  "vulture==2.16",
]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { pypdf = "2026-10-29T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.vulture]
paths = ["gateway", "observability"]
exclude = ["**/tests/**"]
min_confidence = 90
