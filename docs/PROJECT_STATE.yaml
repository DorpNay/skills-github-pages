rejected_improvements:
  - id: AI-CUT-001
    title: "Universal wake-word latency guarantee"
    reason: "Requires measured target hardware and cannot be promised from a paper design."
  - id: AI-CUT-002
    title: "Silero TTS as commercial default"
    reason: "Most models in the upstream repository are non-commercial; exact exceptions must be individually verified."
  - id: AI-CUT-003
    title: "Pure Python raw PCM hotpath"
    reason: "Raw audio should remain in native capture/inference subsystem; Python consumes bounded events."
  - id: AI-CUT-004
    title: "Cloud ASR/TTS fallback"
    reason: "Violates the default local-first voice privacy contract."

blocked_items:
  - id: BLK-RU-TTS-COMMERCIAL
    reason: "Exact Russian voice model card, artifact checksum and license approval required."
  - id: BLK-NATIVE-BENCH
    reason: "No native audio backend or reference 8GB hardware measurement."
  - id: BLK-CLI-SANDBOX
    reason: "No tested container/seccomp/Landlock implementation or escape test evidence."
