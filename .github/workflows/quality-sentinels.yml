name: Independent Quality Sentinels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-sentinels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-sentinel:
    name: Integrity sentinel (HTML / JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse app JavaScript and check UI structure
        run: node scripts/quality-agents.mjs integrity

  security-sentinel:
    name: Security sentinel (keys / rendering / tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secret hygiene and unsafe rendering paths
        run: node scripts/quality-agents.mjs security

  context-sentinel:
    name: Context sentinel (budgets / memory / tool loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check context and tool-call limits
        run: node scripts/quality-agents.mjs context

  pages-build:
    name: Jekyll build sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated site artifact
        run: node scripts/quality-agents.mjs build

  browser-e2e:
    name: Real Chromium browser regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the built site in Chromium
        run: npx playwright test
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
