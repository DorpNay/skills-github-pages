name: Independent Quality Sentinels

on:
  push:
    branches: [main]
    paths:
      - 'index.md'
      - 'assets/js/**'
      - 'sw.js'
      - 'assets/js/**'
      - 'sw.js'
      - 'tailwind.config.cjs'
      - 'assets/css/tailwind.input.css'
      - 'scripts/verify-tailwind-output.mjs'
      - 'tests/e2e/**'
      - 'tests/check-action-pinning.test.mjs'
      - 'scripts/audit-inline-js.mjs'
      - 'tests/audit-inline-js.test.mjs'
      - 'tests/fixtures/inline-js-audit*.html'
      - 'scripts/quality-agents.mjs'
      - 'scripts/check-action-pinning.mjs'
      - 'scripts/provider-smoke*.mjs'
      - 'scripts/diagnose_model_runtime.sh'
      - 'lighthouserc.cjs'
      - '.github/workflows/quality-sentinels.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.md'
      - 'tailwind.config.cjs'
      - 'assets/css/tailwind.input.css'
      - 'scripts/verify-tailwind-output.mjs'
      - 'tests/e2e/**'
      - 'tests/check-action-pinning.test.mjs'
      - 'scripts/audit-inline-js.mjs'
      - 'tests/audit-inline-js.test.mjs'
      - 'tests/fixtures/inline-js-audit*.html'
      - 'scripts/quality-agents.mjs'
      - 'scripts/check-action-pinning.mjs'
      - 'scripts/provider-smoke*.mjs'
      - 'scripts/diagnose_model_runtime.sh'
      - 'lighthouserc.cjs'
      - '.github/workflows/quality-sentinels.yml'
  workflow_dispatch:
    inputs:
      run_static_analysis:
        description: "Run Ruff, Bandit and Semgrep (slow; optional)"
        required: false
        type: boolean
        default: false
      run_chromium:
        description: "Run full Chromium visual/layout regression (slow; optional)"
        required: false
        type: boolean
        default: false
      run_lightpanda:
        description: "Run the experimental fast JavaScript/DOM smoke"
        required: false
        type: boolean
        default: false
      verify_live_pages:
        description: "Verify the published Pages revision and release contract"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-sentinels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-sentinel:
    name: Integrity sentinel (HTML / JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce immutable GitHub Action references
        run: node scripts/check-action-pinning.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test immutable action reference parser
        run: node --test tests/check-action-pinning.test.mjs
      - name: Parse app JavaScript and check UI structure
        run: node scripts/quality-agents.mjs integrity
      - name: Syntax-check the secret-safe live provider probes
        run: |
          node --check scripts/provider-smoke.mjs
          node --check scripts/provider-smoke-all.mjs
      - name: Syntax-check the read-only hardware inventory
        run: bash -n scripts/diagnose_model_runtime.sh

  security-sentinel:
    name: Security sentinel (keys / rendering / tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check secret hygiene and unsafe rendering paths
        run: node scripts/quality-agents.mjs security

  context-sentinel:
    name: Context sentinel (budgets / memory / tool loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check context and tool-call limits
        run: node scripts/quality-agents.mjs context

  pages-build:
    name: Jekyll build sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build production Tailwind CSS from repository sources
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tailwindcss@3.4.17
          npx tailwindcss -c tailwind.config.cjs -i assets/css/tailwind.input.css -o assets/css/tailwind.generated.css --minify
          node scripts/verify-tailwind-output.mjs assets/css/tailwind.generated.css
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated Pages artifacts carry the exact commit SHA
        run: |
          expected_revision="$GITHUB_SHA"
          test -s ./_site/index.html
          grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$expected_revision\"" ./_site/index.html
      - name: Install pinned parser for report-only inline JavaScript audit
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund acorn@8.15.0 @lhci/cli@0.16.1
      - name: Verify report-only inline JavaScript AST audit
        run: |
          node --test tests/audit-inline-js.test.mjs
          node scripts/audit-inline-js.mjs ./_site/index.html --summary
      - name: Collect advisory Lighthouse mobile baseline (filesystem only)
        id: lighthouse
        continue-on-error: true
        run: ./node_modules/.bin/lhci autorun --config=./lighthouserc.cjs
      - name: Summarize Lighthouse lab metrics and opportunities
        if: steps.lighthouse.outcome == 'success'
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            const files = readdirSync(".lighthouseci").filter(name => name.endsWith(".json") && name !== "manifest.json");
            const reports = files.map(name => JSON.parse(readFileSync(".lighthouseci/" + name, "utf8"))).filter(report => report.audits && report.categories);
            if (!reports.length) throw new Error("No Lighthouse JSON reports were produced");
            const median = values => {
              const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
              return sorted.length ? sorted[Math.floor((sorted.length - 1) / 2)] : null;
            };
            const metric = (report, id) => report.audits[id]?.numericValue ?? null;
            const score = (report, id) => report.categories[id]?.score == null ? null : Math.round(report.categories[id].score * 100);
            const first = reports[0];
            const opportunities = Object.values(first.audits)
              .filter(audit => audit.details?.type === "opportunity" && audit.score !== 1 && (audit.details.overallSavingsMs || 0) > 0)
              .sort((a, b) => (b.details.overallSavingsMs || 0) - (a.details.overallSavingsMs || 0))
              .slice(0, 8)
              .map(audit => ({ id: audit.id, title: audit.title, savingsMs: Math.round(audit.details.overallSavingsMs || 0), displayValue: audit.displayValue ?? null }));
            const accessibilityIssues = (first.categories.accessibility?.auditRefs || [])
              .map(ref => first.audits[ref.id])
              .filter(audit => audit && audit.score !== null && audit.score !== undefined && audit.score < 1)
              .slice(0, 8)
              .map(audit => ({ id: audit.id, title: audit.title, score: audit.score, displayValue: audit.displayValue ?? null }));
            console.log(JSON.stringify({
              labOnly: true,
              runs: reports.length,
              median: {
                performance: median(reports.map(report => score(report, "performance"))),
                accessibility: median(reports.map(report => score(report, "accessibility"))),
                bestPractices: median(reports.map(report => score(report, "best-practices"))),
                seo: median(reports.map(report => score(report, "seo"))),
                lcpMs: median(reports.map(report => metric(report, "largest-contentful-paint"))),
                cls: median(reports.map(report => metric(report, "cumulative-layout-shift"))),
                tbtMs: median(reports.map(report => metric(report, "total-blocking-time"))),
                inpMs: median(reports.map(report => metric(report, "interaction-to-next-paint"))),
                fcpMs: median(reports.map(report => metric(report, "first-contentful-paint")))
              },
              firstRunOpportunities: opportunities,
              firstRunAccessibilityIssues: accessibilityIssues
            }));
          '
      - name: Note Lighthouse baseline unavailable
        if: steps.lighthouse.outcome != 'success'
        run: echo "::warning::Lighthouse lab baseline did not complete; no performance budget is enforced."
      - name: Verify generated site artifact
        run: node scripts/quality-agents.mjs build


  root-app-smoke:
    name: Required root app boot and interaction smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pinned root-smoke and Tailwind build runtimes
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tailwindcss@3.4.17 @playwright/test@1.64.1
          npx tailwindcss -c tailwind.config.cjs -i assets/css/tailwind.input.css -o assets/css/tailwind.generated.css --minify
          node scripts/verify-tailwind-output.mjs assets/css/tailwind.generated.css
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Install pinned root-smoke browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify root app initializes and delegated controls work
        run: npx playwright test --grep "root app binds delegated controls after initial load|aServi web_search tool uses the private SearXNG gateway before external search|aCodingi and aNoteBooki are navigable same-origin workspaces|root runtime assets stay same-origin and work without a CDN|app shell is available offline after its first successful visit|project filter preserves active chat context and header shows personal/project scope in RU and EN|selecting a project filters the Chats section and the back arrow restores all chats|deleting a project removes its chats but preserves other projects and chats|long chat navigation preserves scroll position and restores keyboard focus after switching chats|chat row menu supports keyboard traversal and restores focus after clone and delete cancellation|shared modes preserve the root frame and scope Notebook chat to checked sources|Notebook sidebar shortcut stays inside the shared root application|aCodingi keeps the shared frame but does not claim an unavailable sandbox|aServi private gateway route works, stays local, and exposes cache status|mobile project and chat navigation controls meet the 44px touch target|sidebar uses compact section actions and gives collapsed Projects space to Chats|provider probe failure keeps credentials out of diagnostics|long project navigation stays internally scrollable without hiding the chats section|Research and Agent function panels update their dynamic copy when language changes|Functions menu opens Agents and Skills and keeps Research method separate from Thorough effort|root navigation opens aNoteBooki as a shared application mode"

  lightpanda-smoke:
    if: ${{ inputs.run_lightpanda }}
    name: Fast JavaScript and DOM smoke (Lightpanda)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Run dynamic DOM smoke without Chromium
        run: |
          npm install --no-save --no-package-lock playwright-core@1.64.1 @lightpanda/browser@1.6.0
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ./_site >/tmp/alandi-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 0.25
          done
          APP_URL=http://127.0.0.1:4173/ node scripts/lightpanda-smoke.mjs

  browser-e2e:
    if: ${{ inputs.run_chromium }}
    name: Real Chromium browser regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Install pinned browser test runtime
        run: |
          # Avoid the known Ubuntu man-db trigger stall during Playwright --with-deps.
          sudo apt-get --yes remove --purge man-db
          npm install --no-save --no-package-lock @playwright/test@1.64.1
          npx playwright install --with-deps chromium
      - name: Exercise the built app in Chromium
        run: npx playwright test --grep-invert "live public site serves the app shell and basic chat controls"
      - name: Wait for the published site to respond
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 "https://dorpnay.github.io/skills-github-pages/?smoke=$GITHUB_SHA" -o /dev/null; then
              echo "Published GitHub Pages responds successfully."
              exit 0
            fi
            echo "Site is not ready yet (attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "Published GitHub Pages did not become available in time."
          exit 1
      - name: Test the actual published site in Chromium
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        env:
          LIVE_SITE_URL: https://dorpnay.github.io/skills-github-pages/
        run: npx playwright test tests/e2e/live-site.spec.mjs
      - name: Verify the deployed main client version after a main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          expected_title=$(grep -m1 -E '^title: AI Mobile Agent v[0-9]+[.][0-9]+' index.md | sed 's/^title: //')
          expected_sha="$GITHUB_SHA"
          test -n "$expected_title"
          test -n "$expected_sha"
          client_url="https://dorpnay.github.io/skills-github-pages/?smoke=$GITHUB_SHA"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 "$client_url" -o /tmp/live-client.html &&
               grep --fixed-strings --quiet "$expected_title" /tmp/live-client.html &&
               grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$expected_sha\"" /tmp/live-client.html; then
              echo "Published client matches main source title via cache-busted URL: $expected_title"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Cache-busted published client did not match main source title: $expected_title"
              exit 1
            fi
            echo "Cache-busted client does not yet match ($expected_title; attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done

          # Also test the exact canonical URL visitors use. No query string or
          # Cache-Control override: this catches a stale GitHub Pages edge response.
          canonical_url="https://dorpnay.github.io/skills-github-pages/"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 \
                 --dump-header /tmp/live-client-canonical.headers \
                 "$canonical_url" -o /tmp/live-client-canonical.html &&
               grep --fixed-strings --quiet "$expected_title" /tmp/live-client-canonical.html &&
               grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$expected_sha\"" /tmp/live-client-canonical.html; then
              echo "Canonical published client matches current main without cache-busting: $expected_title"
              exit 0
            fi
            echo "Canonical URL is not yet serving current main ($expected_title; attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "Canonical published URL remained stale or mismatched: expected $expected_title"
          grep -Ei '^(HTTP/|date:|age:|cache-control:|etag:|last-modified:|via:|x-cache:)' /tmp/live-client-canonical.headers || true
          exit 1

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  live-site-smoke:
    name: Published GitHub Pages release contract
    if: ${{ inputs.verify_live_pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact main revision and owner-approved UI contract on the live site
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLISHED_URL: https://dorpnay.github.io/skills-github-pages/
        run: |
          set -euo pipefail
          cache_url="${PUBLISHED_URL}?smoke=${EXPECTED_SHA}"
          cache_sha=""
          canonical_sha=""
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "$cache_url" -o /tmp/alandi-cache.html; then
              cache_sha="$(grep -oE '<meta name="alandi-build-revision" content="[0-9a-f]+"' /tmp/alandi-cache.html | sed -E 's/.*content="([^"]+)".*/\1/' | head -n 1 || true)"
            fi
            if curl --fail --silent --show-error --location --max-time 20 "$PUBLISHED_URL" -o /tmp/alandi-canonical.html; then
              canonical_sha="$(grep -oE '<meta name="alandi-build-revision" content="[0-9a-f]+"' /tmp/alandi-canonical.html | sed -E 's/.*content="([^"]+)".*/\1/' | head -n 1 || true)"
            fi
            if [ "$cache_sha" = "$EXPECTED_SHA" ] && [ "$canonical_sha" = "$EXPECTED_SHA" ]; then
              break
            fi
            echo "Published revision not current yet (attempt $attempt/18): cache=$cache_sha canonical=$canonical_sha expected=$EXPECTED_SHA"
            sleep 10
          done
          test "$cache_sha" = "$EXPECTED_SHA"
          test "$canonical_sha" = "$EXPECTED_SHA"

          html=/tmp/alandi-canonical.html
          for required in 'id="aserviSettingsGroup"' 'data-i18n="thirdPartySettingsTitle"' 'id="additionalSettings"' 'id="uiLanguage"' 'id="memoryStatusLine"' 'id="projectRecoveryBackupButton"' 'class="hidden composer-stop' 'id="functionsMenu"' 'data-action="open-function-panel" data-function="agents"' 'data-action="open-function-panel" data-function="research"' 'data-action="open-function-panel" data-function="skills"'; do
            grep -Fq "$required" "$html" || { echo "Missing published UI contract marker: $required"; exit 1; }
          done
          for forbidden in 'data-action="open-research-studio"' '<option value="alandi"' 'id="sidebarPreferences"' 'id="sidebarThemeToggle"'; do
            if grep -Fq "$forbidden" "$html"; then
              echo "Forbidden published UI element is still present: $forbidden"
              exit 1
            fi
          done
          status_line="$(grep -bo 'id="memoryStatusLine"' "$html" | head -n 1 | cut -d: -f1)"
          memory_details="$(grep -bo 'id="memoryToolsDetails"' "$html" | head -n 1 | cut -d: -f1)"
          test -n "$status_line" && test -n "$memory_details" && test "$status_line" -lt "$memory_details"
          echo "Live Pages serves exact main SHA $EXPECTED_SHA and the owner-approved UI contract."


  static-analysis:
    if: ${{ inputs.run_static_analysis }}
    name: Independent static analysis (Ruff gate; Bandit/Semgrep advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned audit-only scanners
        run: |
          mkdir -p audit-reports
          python -m pip install --disable-pip-version-check \
            ruff==0.17.3 bandit==1.9.4 semgrep==1.183.0
          {
            ruff --version
            bandit --version
            semgrep --version
          } > audit-reports/tool-versions.txt
      - name: Run Ruff, Bandit and Semgrep Community Edition
        shell: bash
        run: |
          set +e
          ruff check gateway scripts router observability intel latency tests --select F,E4,E7,E9 --output-format=json \
            > audit-reports/ruff.json 2> audit-reports/ruff.stderr
          echo "$?" > audit-reports/ruff.exit
          bandit -r gateway scripts router observability intel latency -x gateway/tests,gateway/evals -f json \
            > audit-reports/bandit.json 2> audit-reports/bandit.stderr
          echo "$?" > audit-reports/bandit.exit
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script" and not dict(attrs).get("src"):
                      self.active = True
                      self.current = []

              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      source = "".join(self.current).strip()
                      if source:
                          self.scripts.append(source)
                      self.active = False
                      self.current = []

          extractor = InlineScripts()
          extractor.feed(Path("index.md").read_text(encoding="utf-8"))
          for index, source in enumerate(extractor.scripts):
              Path(f"audit-reports/ui-inline-{index}.js").write_text(source, encoding="utf-8")

          print(f"Extracted {len(extractor.scripts)} root-client inline UI scripts for SAST.")
          PY
          if semgrep scan --config p/default --json gateway scripts router observability intel latency gateway/tests tests audit-reports/ui-inline-*.js > audit-reports/semgrep.json 2> audit-reports/semgrep.stderr; then
            semgrep_status=0
          else
            semgrep_status=$?
          fi
          echo "$semgrep_status" > audit-reports/semgrep.exit
          echo "Findings are report-only at this stage; scanner/runtime errors are checked separately."
          exit 0
      - name: Upload raw scanner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-static-analysis
          path: audit-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Reject scanner execution errors, not findings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failed = []
          for name in ("ruff", "bandit", "semgrep"):
              path = Path("audit-reports") / f"{name}.exit"
              if not path.exists():
                  failed.append(f"{name}: missing exit record")
                  continue
              code = int(path.read_text().strip())
              print(f"{name}: exit={code}; Ruff findings are blocking, Bandit/Semgrep findings are advisory")
              if name == "ruff" and code != 0:
                  failed.append(f"ruff: correctness lint findings (exit {code})")
              elif name != "ruff" and code >= 2:
                  failed.append(f"{name}: scanner failed with {code}")
          if failed:
              print("\n".join(failed), file=sys.stderr)
              raise SystemExit(1)
          PY
