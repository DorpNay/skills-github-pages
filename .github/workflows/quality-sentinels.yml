name: Independent Quality Sentinels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-sentinels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-sentinel:
    name: Integrity sentinel (HTML / JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce immutable GitHub Action references
        run: node scripts/check-action-pinning.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Parse app JavaScript and check UI structure
        run: node scripts/quality-agents.mjs integrity
      - name: Syntax-check the secret-safe live provider probes
        run: |
          node --check scripts/provider-smoke.mjs
          node --check scripts/provider-smoke-all.mjs
      - name: Syntax-check the read-only hardware inventory
        run: bash -n scripts/diagnose_model_runtime.sh

  security-sentinel:
    name: Security sentinel (keys / rendering / tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check secret hygiene and unsafe rendering paths
        run: node scripts/quality-agents.mjs security

  context-sentinel:
    name: Context sentinel (budgets / memory / tool loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check context and tool-call limits
        run: node scripts/quality-agents.mjs context

  pages-build:
    name: Jekyll build sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated Pages artifacts carry the exact commit SHA
        run: |
          expected_revision="$GITHUB_SHA"
          test -s ./_site/index.html
          test -s ./_site/landing/index.html
          grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$expected_revision\"" ./_site/index.html
          grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$expected_revision\"" ./_site/landing/index.html
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify generated site artifact
        run: node scripts/quality-agents.mjs build

  browser-e2e:
    name: Real Chromium browser regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Install pinned browser test runtime
        run: |
          # Avoid the known Ubuntu man-db trigger stall during Playwright --with-deps.
          sudo apt-get --yes remove --purge man-db
          npm install --no-save --no-package-lock @playwright/test@1.64.1
          npx playwright install --with-deps chromium
      - name: Exercise the built app in Chromium
        run: npx playwright test --grep-invert "live public site serves the app shell and basic chat controls"
      - name: Wait for the published site to respond
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 "https://dorpnay.github.io/skills-github-pages/?smoke=$GITHUB_SHA" -o /dev/null; then
              echo "Published GitHub Pages responds successfully."
              exit 0
            fi
            echo "Site is not ready yet (attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "Published GitHub Pages did not become available in time."
          exit 1
      - name: Test the actual published site in Chromium
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        env:
          LIVE_SITE_URL: https://dorpnay.github.io/skills-github-pages/
        run: npx playwright test tests/e2e/live-site.spec.mjs
      - name: Verify the deployed main client version after a main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          expected_title=$(grep -m1 -E '^title:' index.md | sed 's/^title: //')
          expected_sha="$GITHUB_SHA"
          test -n "$expected_title"
          test -n "$expected_sha"
          client_url="https://dorpnay.github.io/skills-github-pages/?smoke=$GITHUB_SHA"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 "$client_url" -o /tmp/live-client.html &&
               grep --fixed-strings --quiet "$expected_title" /tmp/live-client.html &&
               grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$expected_sha\"" /tmp/live-client.html; then
              echo "Published client matches main source title via cache-busted URL: $expected_title"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Cache-busted published client did not match main source title: $expected_title"
              exit 1
            fi
            echo "Cache-busted client does not yet match ($expected_title; attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done

          # Also test the exact canonical URL visitors use. No query string or
          # Cache-Control override: this catches a stale GitHub Pages edge response.
          canonical_url="https://dorpnay.github.io/skills-github-pages/"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 \
                 --dump-header /tmp/live-client-canonical.headers \
                 "$canonical_url" -o /tmp/live-client-canonical.html &&
               grep --fixed-strings --quiet "$expected_title" /tmp/live-client-canonical.html &&
               grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$expected_sha\"" /tmp/live-client-canonical.html; then
              echo "Canonical published client matches current main without cache-busting: $expected_title"
              exit 0
            fi
            echo "Canonical URL is not yet serving current main ($expected_title; attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "Canonical published URL remained stale or mismatched: expected $expected_title"
          grep -Ei '^(HTTP/|date:|age:|cache-control:|etag:|last-modified:|via:|x-cache:)' /tmp/live-client-canonical.headers || true
          exit 1

      - name: Verify the published landing content on canonical URL after main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          landing_url="https://dorpnay.github.io/skills-github-pages/landing/?smoke=$GITHUB_SHA"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 "$landing_url" -o /tmp/alandi-landing.html &&
               grep --fixed-strings --quiet "Сохраняй контроль над средой" /tmp/alandi-landing.html &&
               grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$GITHUB_SHA\"" /tmp/alandi-landing.html; then
              echo "The current landing content is published via cache-busted URL."
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "The current landing content was not published in time."
              exit 1
            fi
            echo "The cache-busted landing content is not available yet (attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done

          canonical_landing_url="https://dorpnay.github.io/skills-github-pages/landing/"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 15 \
                 --dump-header /tmp/alandi-landing-canonical.headers \
                 "$canonical_landing_url" -o /tmp/alandi-landing-canonical.html &&
               grep --fixed-strings --quiet "Сохраняй контроль над средой" /tmp/alandi-landing-canonical.html &&
               grep --fixed-strings --quiet "name=\"alandi-build-revision\" content=\"$GITHUB_SHA\"" /tmp/alandi-landing-canonical.html; then
              echo "The canonical /landing/ URL serves the current content without cache-busting."
              exit 0
            fi
            echo "The canonical landing URL is not yet serving current content (attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "The canonical /landing/ URL remained stale or mismatched."
          grep -Ei '^(HTTP/|date:|age:|cache-control:|etag:|last-modified:|via:|x-cache:)' /tmp/alandi-landing-canonical.headers || true
          exit 1
      - name: Test the published aLandi landing page in Chromium
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIVE_SITE_URL: https://dorpnay.github.io/skills-github-pages/
        run: npx playwright test tests/e2e/landing.spec.mjs
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  live-site-smoke:
    name: Published GitHub Pages release contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact main revision and owner-approved UI contract on the live site
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLISHED_URL: https://dorpnay.github.io/skills-github-pages/
        run: |
          set -euo pipefail
          cache_url="${PUBLISHED_URL}?smoke=${EXPECTED_SHA}"
          cache_sha=""
          canonical_sha=""
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "$cache_url" -o /tmp/alandi-cache.html; then
              cache_sha="$(grep -oE '<meta name="alandi-build-revision" content="[0-9a-f]+"' /tmp/alandi-cache.html | sed -E 's/.*content="([^"]+)".*/\1/' | head -n 1 || true)"
            fi
            if curl --fail --silent --show-error --location --max-time 20 "$PUBLISHED_URL" -o /tmp/alandi-canonical.html; then
              canonical_sha="$(grep -oE '<meta name="alandi-build-revision" content="[0-9a-f]+"' /tmp/alandi-canonical.html | sed -E 's/.*content="([^"]+)".*/\1/' | head -n 1 || true)"
            fi
            if [ "$cache_sha" = "$EXPECTED_SHA" ] && [ "$canonical_sha" = "$EXPECTED_SHA" ]; then
              break
            fi
            echo "Published revision not current yet (attempt $attempt/18): cache=$cache_sha canonical=$canonical_sha expected=$EXPECTED_SHA"
            sleep 10
          done
          test "$cache_sha" = "$EXPECTED_SHA"
          test "$canonical_sha" = "$EXPECTED_SHA"

          html=/tmp/alandi-canonical.html
          for required in 'id="aserviSettingsGroup"' 'data-i18n="thirdPartySettingsTitle"' 'id="additionalSettings"' 'id="uiLanguage"' 'id="memoryStatusLine"' 'id="projectRecoveryBackupButton"' 'id="stopBtn"' 'id="functionsMenu"' 'id="functionsDrawerNav"' 'id="notebookFunctionSettings"' 'id="notebookWorkspace"' 'id="chatSectionTitle"' 'id="chatListBack"' 'id="projectNavigationList"' 'id="sidebarSearchInput"' 'id="brandWordmark"' 'data-action="open-function-panel" data-function="agents"' 'data-action="open-function-panel" data-function="research"' 'data-action="open-function-panel" data-function="skills"'; do
            grep -Fq "$required" "$html" || { echo "Missing published UI contract marker: $required"; exit 1; }
          done
          for forbidden in 'data-action="open-research-studio"' '<option value="alandi"' 'id="sidebarPreferences"' 'id="sidebarThemeToggle"'; do
            if grep -Fq "$forbidden" "$html"; then
              echo "Forbidden published UI element is still present: $forbidden"
              exit 1
            fi
          done
          status_line="$(grep -bo 'id="memoryStatusLine"' "$html" | head -n 1 | cut -d: -f1)"
          memory_details="$(grep -bo 'id="memoryToolsDetails"' "$html" | head -n 1 | cut -d: -f1)"
          test -n "$status_line" && test -n "$memory_details" && test "$status_line" -lt "$memory_details"
          runtime_url="${PUBLISHED_URL}assets/js/app.js"
          curl --fail --silent --show-error --location --max-time 20 "$runtime_url" -o /tmp/alandi-app.js
          for required_runtime in "function renderChatList()" "function renderNotebookPanel()" "async function openFunctionPanel(kind)" "dataset.action='select-project'"; do
            grep -Fq "$required_runtime" /tmp/alandi-app.js || { echo "Missing published runtime contract marker: $required_runtime"; exit 1; }
          done
          echo "Live Pages serves exact main SHA $EXPECTED_SHA and the owner-approved UI contract."


  static-analysis:
    name: Independent static analysis (Ruff gate; Bandit/Semgrep advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned audit-only scanners
        run: |
          mkdir -p audit-reports
          python -m pip install --disable-pip-version-check \
            ruff==0.17.3 bandit==1.9.4 semgrep==1.183.0
          {
            ruff --version
            bandit --version
            semgrep --version
          } > audit-reports/tool-versions.txt
      - name: Run Ruff, Bandit and Semgrep Community Edition
        shell: bash
        run: |
          set +e
          ruff check gateway scripts router observability intel latency tests --select F,E4,E7,E9 --output-format=json \
            > audit-reports/ruff.json 2> audit-reports/ruff.stderr
          echo "$?" > audit-reports/ruff.exit
          bandit -r gateway scripts router observability intel latency -x gateway/tests,gateway/evals -f json \
            > audit-reports/bandit.json 2> audit-reports/bandit.stderr
          echo "$?" > audit-reports/bandit.exit
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script" and not dict(attrs).get("src"):
                      self.active = True
                      self.current = []

              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      source = "".join(self.current).strip()
                      if source:
                          self.scripts.append(source)
                      self.active = False
                      self.current = []

          extractor = InlineScripts()
          extractor.feed(Path("index.md").read_text(encoding="utf-8"))
          for index, source in enumerate(extractor.scripts):
              Path(f"audit-reports/ui-inline-{index}.js").write_text(source, encoding="utf-8")

          landing = Path("landing/index.html").read_text(encoding="utf-8")
          if landing.startswith("---\n"):
              _, _, landing = landing.split("---\n", 2)
          Path("audit-reports/landing-page.html").write_text(landing, encoding="utf-8")
          print(f"Extracted {len(extractor.scripts)} inline UI scripts and normalized the Jekyll landing page for SAST.")
          PY
          semgrep_targets=(gateway scripts router observability intel latency gateway/tests tests assets/js/app.js audit-reports/landing-page.html)
          while IFS= read -r -d '' inline_script; do
            semgrep_targets+=("$inline_script")
          done < <(find audit-reports -maxdepth 1 -type f -name 'ui-inline-*.js' -print0)
          semgrep scan --config p/default --json "${semgrep_targets[@]}" \
            > audit-reports/semgrep.json 2> audit-reports/semgrep.stderr
          echo "$?" > audit-reports/semgrep.exit
          echo "Findings are report-only at this stage; scanner/runtime errors are checked separately."
          exit 0
      - name: Upload raw scanner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-static-analysis
          path: audit-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Reject scanner execution errors, not findings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failed = []
          for name in ("ruff", "bandit", "semgrep"):
              path = Path("audit-reports") / f"{name}.exit"
              if not path.exists():
                  failed.append(f"{name}: missing exit record")
                  continue
              code = int(path.read_text().strip())
              print(f"{name}: exit={code}; Ruff findings are blocking, Bandit/Semgrep findings are advisory")
              if name == "ruff" and code != 0:
                  failed.append(f"ruff: correctness lint findings (exit {code})")
              elif name != "ruff" and code >= 2:
                  failed.append(f"{name}: scanner failed with {code}")
          if failed:
              print("\n".join(failed), file=sys.stderr)
              raise SystemExit(1)
          PY
