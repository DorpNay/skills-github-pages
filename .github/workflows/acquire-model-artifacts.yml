name: Acquire pinned aLandi model artifacts

on:
  push:
    branches:
      - "feat/model-artifact-acquisition-*"
    paths:
      - "models/manifest.json"
      - "scripts/download_model_artifacts.py"
      - ".github/workflows/acquire-model-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-artifact-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    name: Download, hash and package non-primary artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Download pinned artifacts outside the Git working tree
        run: |
          python scripts/download_model_artifacts.py \
            --manifest models/manifest.json \
            --output-dir "$RUNNER_TEMP/alandi-model-artifacts" \
            --workers 3 \
            --timeout 900
      - name: Upload embedding model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-qwen3-embedding-0.6b-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/qwen3_embedding_06b/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload reranker model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-qwen3-reranker-0.6b-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/qwen3_reranker_06b/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload sherpa-onnx Qwen ASR INT8 CPU bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-sherpa-qwen3-asr-0.6b-int8-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/sherpa_qwen3_asr_06b_int8/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload ASR model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-qwen3-asr-0.6b-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/qwen3_asr_06b/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload VAD model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-silero-vad-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/silero_vad/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Whisper comparison model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-whisper-large-v3-turbo-q5_0-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/whisper_large_v3_turbo_q5_0/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Russian Piper voice and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-piper-ru-dmitri-medium-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/piper_ru_dmitri_medium*/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Qwen vision companion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-qwen35-vision-projector-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/qwen35_mmproj/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload complete acquisition lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alandi-model-artifacts-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/alandi-model-artifacts/artifacts-lock.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
