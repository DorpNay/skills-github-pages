name: Acquire verified Vosk small Russian model

on:
  # Run once on the isolated acquisition branch; after merge this workflow is manually reusable.
  push:
    branches:
      - artifact/acquire-vosk-current-main-20261105
    paths:
      - ".github/workflows/acquire-vosk-small-ru.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    name: Fetch, hash and validate exact Vosk archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download the pinned archive (official source, then immutable HF mirror)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          archive="artifact/vosk-model-small-ru-0.22.zip"
          official="https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
          mirror="https://huggingface.co/rhasspy/vosk-models/resolve/e7ac2109d134b5f2404ba95389b2fb51916d4cab/ru/vosk-model-small-ru-0.22.zip"
          if curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 --output "$archive" "$official"; then
            source_url="$official"
          else
            rm -f "$archive"
            curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 --output "$archive" "$mirror"
            source_url="$mirror"
          fi
          actual_size="$(stat -c '%s' "$archive")"
          expected_size="46236750"
          expected_sha256="961d5ff98a17f4aa6de69864d0aa71fa5bac682301d2b5d17a3f24c5c99a46d4"
          test "$actual_size" = "$expected_size"
          printf '%s  %s\n' "$expected_sha256" "$(basename "$archive")" > artifact/SHA256SUMS
          (cd artifact && sha256sum --check SHA256SUMS)
          SOURCE_URL="$source_url" ARCHIVE="$archive" ACTUAL_SIZE="$actual_size" python - <<'PY'
          import json
          import os
          import stat
          import zipfile
          from pathlib import PurePosixPath

          archive = os.environ["ARCHIVE"]
          max_members = 10000
          max_uncompressed = 250 * 1024 * 1024
          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              if not entries or len(entries) > max_members:
                  raise SystemExit("archive member count is outside the accepted bound")
              total = 0
              for item in entries:
                  name = item.filename
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or "\\" in name or not name:
                      raise SystemExit(f"unsafe archive path: {name!r}")
                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"symlink entry is not allowed: {name!r}")
                  total += item.file_size
                  if item.file_size > 100 * 1024 * 1024 or total > max_uncompressed:
                      raise SystemExit("archive expands beyond the configured safety bounds")
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"ZIP CRC validation failed for {bad!r}")

          metadata = {
              "artifact_id": "vosk-model-small-ru-0.22",
              "source_url": os.environ["SOURCE_URL"],
              "upstream_revision": "rhasspy/vosk-models@e7ac2109d134b5f2404ba95389b2fb51916d4cab (mirror) / official Vosk catalog release 0.22",
              "license_spdx": "Apache-2.0",
              "sha256": "961d5ff98a17f4aa6de69864d0aa71fa5bac682301d2b5d17a3f24c5c99a46d4",
              "size_bytes": int(os.environ["ACTUAL_SIZE"]),
              "zip_integrity": "validated",
              "runtime_integration": "not_performed",
              "target_hardware_eval": "not_performed",
          }
          with open("artifact/metadata.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY
      - name: Persist the verified model archive in the repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/artifact/acquire-vosk-current-main-20261105'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/vosk
          cp artifact/vosk-model-small-ru-0.22.zip models/vosk/
          cp artifact/SHA256SUMS models/vosk/
          cp artifact/metadata.json models/vosk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/vosk/vosk-model-small-ru-0.22.zip models/vosk/SHA256SUMS models/vosk/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "model: vendor verified Vosk RU 0.22 archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload the validated archive and provenance sidecars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vosk-model-small-ru-0.22-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
