name: Lite Gateway Tests

on:
  push:
    paths:
      - "gateway/**"
      - "intel/**"
      - "latency/**"
      - "router/**"
      - "scripts/manifest_state.py"
      - "scripts/check_intel_triad.py"
      - "scripts/check_deploy_preflight.py"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "intel/**"
      - "latency/**"
      - "router/**"
      - "scripts/manifest_state.py"
      - "scripts/check_intel_triad.py"
      - "scripts/check_deploy_preflight.py"
      - ".github/workflows/gateway-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: FastAPI gateway contract and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gateway/requirements*.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r gateway/requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q gateway
      - name: Validate V-016 state fingerprint and INTEL triad
        run: |
          python scripts/manifest_state.py
          python scripts/check_intel_triad.py
      - name: Run gateway tests without a real model or API key
        run: python -m pytest -q gateway/tests
      - name: Run deployment template preflight
        run: python scripts/check_deploy_preflight.py
      - name: Run deterministic six-layer offline evaluation
        run: python gateway/evals/run_six_layer_eval.py
