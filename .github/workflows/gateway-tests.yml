name: Lite Gateway Tests

on:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: FastAPI gateway contract and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gateway/requirements*.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r gateway/requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q gateway
      - name: Run gateway tests without a real model or API key
        run: python -m pytest -q gateway/tests
