name: Dead Code Audit (Report Only)

on:
  pull_request:
    paths:
      - "gateway/**"
      - "observability/**"
      - "scripts/**"
      - ".github/workflows/dead-code-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulture-report:
    name: Generate manual-review dead-code report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned static analyzer
        run: python -m pip install vulture==2.16
      - name: Generate report without deleting code
        shell: bash
        run: |
          mkdir -p reports
          set +e
          vulture gateway observability --min-confidence 90 > reports/dead_code_audit.md 2>&1
          status=$?
          set -e
          printf "\n\nVulture exit status: %s\n" "$status" >> reports/dead_code_audit.md
          cat reports/dead_code_audit.md
          # Findings are advisory; dynamic framework callbacks can be false positives.
          # This job must never remove code or block a functional release by itself.
          exit 0
      - name: Upload Vulture report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulture-dead-code-audit
          path: reports/dead_code_audit.md
          if-no-files-found: warn
          retention-days: 14
