name: Provider smoke test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to test with a short live request
        required: true
        type: choice
        options:
          - gemini
          - groq
          - openrouter
          - nvidia
          - huggingface
      model:
        description: Optional model ID override (blank uses the current default)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: provider-smoke-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Test ${{ inputs.provider }} model access
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Gemini
        if: inputs.provider == 'gemini'
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_OVERRIDE: ${{ inputs.model }}
        run: node scripts/provider-smoke.mjs gemini
      - name: Test Groq
        if: inputs.provider == 'groq'
        env:
          API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_OVERRIDE: ${{ inputs.model }}
        run: node scripts/provider-smoke.mjs groq
      - name: Test OpenRouter
        if: inputs.provider == 'openrouter'
        env:
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_OVERRIDE: ${{ inputs.model }}
        run: node scripts/provider-smoke.mjs openrouter
      - name: Test NVIDIA NIM
        if: inputs.provider == 'nvidia'
        env:
          API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODEL_OVERRIDE: ${{ inputs.model }}
        run: node scripts/provider-smoke.mjs nvidia
      - name: Test Hugging Face
        if: inputs.provider == 'huggingface'
        env:
          API_KEY: ${{ secrets.HF_TOKEN }}
          MODEL_OVERRIDE: ${{ inputs.model }}
        run: node scripts/provider-smoke.mjs huggingface
