name: One-off Independent Code Quality Audit

on:
  pull_request:
    paths:
      - "gateway/**"
      - "scripts/**"
      - "router/**"
      - "observability/**"
      - "intel/**"
      - "latency/**"
      - "index.md"
      - ".github/workflows/one-off-code-quality-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-off-code-quality-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Ruff + Bandit + Semgrep CE (diagnostic only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install exact, temporary scanner versions
        run: |
          python -m pip install --disable-pip-version-check \
            ruff==0.17.3 bandit==1.9.4 semgrep==1.183.0
          ruff --version
          bandit --version
          semgrep --version
      - name: Run independent scanners and preserve every report
        shell: bash
        run: |
          set -u
          mkdir -p audit-reports
          run_scan() {
            name="$1"
            shift
            echo "::group::${name}"
            "$@" >"audit-reports/${name}.stdout" 2>"audit-reports/${name}.stderr"
            result=$?
            printf '%s\n' "$result" >"audit-reports/${name}.exit"
            echo "${name} exit code: ${result}"
            echo "::endgroup::"
          }
          run_scan ruff ruff check gateway scripts router observability intel latency --output-format=json
          run_scan bandit bandit -r gateway -f json
          run_scan semgrep semgrep scan --config p/default --json
      - name: Upload raw scanner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-code-quality-audit
          path: audit-reports/
          if-no-files-found: error
          retention-days: 7
      - name: Fail only when a scanner itself could not complete
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          report_dir = Path("audit-reports")
          scanner_names = ("ruff", "bandit", "semgrep")
          failed = []
          for name in scanner_names:
              path = report_dir / f"{name}.exit"
              if not path.exists():
                  failed.append(f"{name}: no exit record")
                  continue
              code = int(path.read_text().strip())
              print(f"{name}: exit={code} (1 means findings; >=2 means scanner/config/runtime error)")
              if code >= 2:
                  failed.append(f"{name}: scanner error {code}")
          if failed:
              print("\n".join(failed), file=sys.stderr)
              raise SystemExit(1)
          PY
